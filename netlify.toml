[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "public"

[build.environment]
  NPM_FLAGS = "--include=dev"
  SECRETS_SCAN_OMIT_KEYS = "NODE_ENV,AWS_LAMBDA_JS_RUNTIME,FIREBASE_PROJECT_ID"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express", "firebase-admin"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/ready"
  to = "/.netlify/functions/api/ready"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200

[[redirects]]
  from = "/live"
  to = "/.netlify/functions/api/live"
  status = 200

[[redirects]]
  from = "/"
  to = "/.netlify/functions/api/"
  status = 200
  force = true
